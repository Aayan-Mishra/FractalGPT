[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractal-folding"
version = "0.1.0"
description = "FRACTAL: Framework for Representation-guided Atomic ConsTruction & ALignment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FRACTAL Contributors" }]

dependencies = [
  "numpy>=1.24",
  "certifi>=2024.0.0",
  "torch>=2.1",
  "typer>=0.12",
  "pydantic>=2.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
esm = ["fair-esm>=2.0.0"]
train = ["tqdm>=4.66"]
data = ["requests>=2.31", "tqdm>=4.66", "gemmi>=0.6.6"]
test = ["pytest>=8.0"]
viz = ["matplotlib>=3.8"]

[project.scripts]
proteinfold = "fractal.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
