[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractalml"
version = "1.0.0"
description = "FRACTAL: Framework for Representation-guided Atomic ConsTruction & ALignment - A protein structure prediction system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aayan Mishra" }]
keywords = ["protein", "folding", "structure-prediction", "bioinformatics", "deep-learning", "esm", "alphafold"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "certifi>=2024.0.0",
  "torch>=2.1",
  "typer>=0.12",
  "pydantic>=2.5",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Aayan-Mishra/FractalGPT"
Repository = "https://github.com/Aayan-Mishra/FractalGPT"
Documentation = "https://github.com/Aayan-Mishra/FractalGPT#readme"
Issues = "https://github.com/Aayan-Mishra/FractalGPT/issues"

[project.optional-dependencies]
esm = ["fair-esm>=2.0.0"]
train = ["tqdm>=4.66"]
data = ["requests>=2.31", "tqdm>=4.66", "gemmi>=0.6.6"]
test = ["pytest>=8.0"]
viz = ["matplotlib>=3.8"]
webui = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pyngrok>=7.0",
]

[project.scripts]
fractal = "fractal.cli:app"
proteinfold = "fractal.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
